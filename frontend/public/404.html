<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Telemetry Out of Bounds | Overcut.ai</title>
    <meta name="description" content="Requested telemetry session coordinate or sector anchor is outside the recorded session boundary." />
    <style>
      body {
        margin: 0;
        background-color: #060709;
        color: #cbd5e1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      main {
        max-width: 500px;
        background: #0d0f14;
        border: 1px solid #1a202c;
        border-radius: 4px;
        padding: 40px 30px;
      }
      h1 {
        font-size: 26px;
        color: #f59e0b;
        margin: 0 0 16px 0;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        background-color: #f59e0b;
        color: #000000;
        font-weight: 700;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.12em;
        border-radius: 3px;
        transition: background 0.2s;
      }
      a:hover {
        background-color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404: Telemetry Out of Bounds</h1>
      <p>
        The requested telemetry session coordinate or sector anchor is outside the recorded session boundary.
      </p>
