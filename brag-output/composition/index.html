<!doctype html>
<html
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#030507"},
    {"id":"color-ink","type":"color","label":"Text","default":"#EEF6FC"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#00D4FF"},
    {"id":"color-ev","type":"color","label":"EV signal","default":"#00FF88"},
    {"id":"color-severity","type":"color","label":"Severity","default":"#FF6B35"},
    {"id":"font-display","type":"string","label":"Display font","default":"Space Grotesk"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>Overcut.ai — Precision Diagnostics. At Race Speed.</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
        font-display: block;
      }
      :root {
        --ground: #030507;
        --surface: #080c10;
        --surface-2: #0d1218;
        --border: #243040;
        --ink: #eef6fc;
        --ink-2: #d4e4f0;
        --ink-3: #9ab0c4;
        --ink-4: #6b8299;
        --accent: #00d4ff;
        --f1: #e8ff00;
        --ev: #00ff88;
        --severity: #ff6b35;
        --font-display: "Space Grotesk", "Inter", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", "Space Mono", monospace;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ground);
      }
      #root {
        position: absolute;
        inset: 0;
        background: var(--ground);
        overflow: hidden;
      }
      .scene-host {
        position: absolute;
        inset: 0;
      }
      #fade-out {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        z-index: 90;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="host-scene-1"
        class="scene-host"
        data-composition-id="scene-1"
        data-composition-src="compositions/scene-1-wire.html"
        data-start="0"
        data-duration="3.2"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="host-scene-2"
        class="scene-host"
        data-composition-id="scene-2"
        data-composition-src="compositions/scene-2-machines.html"
        data-start="3.2"
        data-duration="3.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="host-scene-3"
        class="scene-host"
        data-composition-id="scene-3"
        data-composition-src="compositions/scene-3-dossier.html"
        data-start="6.4"
        data-duration="5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="host-scene-4"
        class="scene-host"
        data-composition-id="scene-4"
        data-composition-src="compositions/scene-4-device.html"
        data-start="11.4"
        data-duration="4.2"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="host-scene-5"
        class="scene-host"
        data-composition-id="scene-5"
        data-composition-src="compositions/scene-5-wordmark.html"
        data-start="15.6"
        data-duration="4.4"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div id="fade-out" class="clip" data-start="19.45" data-duration="0.55" data-track-index="20"></div>

      <audio
        id="bg-music"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.32"
        data-fade-in="0.6"
        data-fade-out="0.8"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
      ></audio>
      <audio
        id="sfx-band"
        data-start="1.5"
        data-duration="0.6"
        data-track-index="11"
        data-volume="0.42"
        src="assets/sfx/casino/card-slide-2.ogg"
      ></audio>
      <audio
        id="sfx-panel"
        data-start="4.15"
        data-duration="0.19"
        data-track-index="12"
        data-volume="0.45"
        src="assets/sfx/interface/drop_002.ogg"
      ></audio>
      <audio
        id="sfx-row"
        data-start="6.56"
        data-duration="0.11"
        data-track-index="13"
        data-volume="0.3"
        src="assets/sfx/interface/drop_001.ogg"
      ></audio>
      <audio
        id="sfx-stamp"
        data-start="8.74"
        data-duration="0.19"
        data-track-index="14"
        data-volume="0.6"
        src="assets/sfx/impact/impactSoft_medium_001.ogg"
      ></audio>
      <audio
        id="sfx-vram"
        data-start="13.11"
        data-duration="0.66"
        data-track-index="15"
        data-volume="0.45"
        src="assets/sfx/impact/impactPlate_light_001.ogg"
      ></audio>
      <audio
        id="sfx-bell"
        data-start="17.47"
        data-duration="0.7"
        data-track-index="16"
        data-volume="0.5"
        src="assets/sfx/impact/impactBell_heavy_003.ogg"
      ></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#fade-out", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.in" }, 19.45);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
